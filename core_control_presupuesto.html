// =====================================================================
// # 03 ESTADO
// =====================================================================
const state = { category: 'aduana', search: '', ubicFilter: '', expandedKeys: new Set() };
function fmtUSD(n, opts = {}) {
  const { decimals = 0 } = opts;
  const v = Number(n) || 0;
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtNum(n, decimals = 0) { return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }
function initials(name) { return name.trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase(); }
// Línea no tiene tarifa en US$ (es cupo/volumen adjudicado por naviera) — se muestra en FCL.
function fmtVal(n, unit, opts = {}) { return unit === 'fcl' ? fmtNum(n, opts.decimals ?? 1) + ' FCL' : fmtUSD(n, opts); }

// =====================================================================
// # 04 TEMA CLARO/OSCURO
// =====================================================================
function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  const t = document.getElementById('themeToggle');
  t.classList.toggle('on', mode === 'dark');
}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(prefersDark ? 'dark' : 'light');
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

// =====================================================================
// # 05 TABS DE CATEGORÍA
// =====================================================================
function renderTabs() {
  const el = document.getElementById('categoryTabs');
  el.innerHTML = Object.entries(DATA).map(([key, cat]) =>
    `<button class="${state.category === key ? 'active' : ''}" data-cat="${key}">${cat.icon} ${cat.label}</button>`
  ).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.category = btn.dataset.cat;
      state.search = ''; state.ubicFilter = ''; state.expandedKeys.clear();
      document.getElementById('searchInput').value = '';
      renderAll();
    });
  });
}

// =====================================================================
// # 06 KPIs
// =====================================================================
function renderKPIs() {
  const el = document.getElementById('kpiStrip');
  const cat = DATA[state.category];
  const unit = cat.unit || '$';
  const rows = cat.rows;
  const presupuestoTotal = rows.reduce((a, r) => a + r.presupuesto_total, 0);
  const presupuestoEjecutado = rows.reduce((a, r) => a + r.presupuesto_ejecutado, 0);
  const fclEjecutado = rows.reduce((a, r) => a + r.fcl_ejecutado, 0);
  const viajesEstimados = rows.reduce((a, r) => a + r.viajes_estimados, 0);
  const nProveedores = new Set(rows.map(r => r.proveedor)).size;
  const pct = presupuestoTotal > 0 ? (presupuestoEjecutado / presupuestoTotal * 100) : 0;
  const unmatched = cat.unmatched_codes;
  const unmatchedTotal = Object.values(unmatched).reduce((a,b) => a+b, 0);
  const label1 = unit === 'fcl' ? 'Volumen adjudicado' : 'Presupuesto adjudicado';
  const label4 = unit === 'fcl' ? 'Sin naviera mapeada' : 'Sin tarifa asignada';

  el.innerHTML = `
    <div class="kpi-card">
      <div class="kpi-icon blue">${unit === 'fcl' ? '🚢' : '💰'}</div>
      <div class="kpi-label">${label1}</div>
      <div class="kpi-value">${fmtVal(presupuestoTotal, unit)}</div>
      <div class="kpi-sub">${nProveedores} proveedor(es)</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon green">✅</div>
      <div class="kpi-label">Ejecutado</div>
      <div class="kpi-value">${fmtVal(presupuestoEjecutado, unit)}</div>
      <div class="kpi-sub">${fmtNum(fclEjecutado,1)} FCL de ${fmtNum(viajesEstimados,0)} estimados</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon orange">📈</div>
      <div class="kpi-label">Avance</div>
      <div class="kpi-value">${pct.toFixed(1)}%</div>
      <div class="kpi-sub">del ${label1.toLowerCase()}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon purple">⚠️</div>
      <div class="kpi-label">${label4}</div>
      <div class="kpi-value">${fmtNum(unmatchedTotal,1)}</div>
      <div class="kpi-sub">${unmatchedTotal ? Object.entries(unmatched).map(([k,v]) => `${k}: ${v}`).join(' · ') : 'todo conciliado'}</div>
    </div>
  `;
}

// =====================================================================
// # 07 FILTROS
// =====================================================================
function populateFilters() {
  const rows = DATA[state.category].rows;
  const ubicaciones = [...new Set(rows.map(r => r.ubicacion))].sort();
  const sel = document.getElementById('ubicFilter');
  sel.innerHTML = '<option value="">Todas las ubicaciones</option>' + ubicaciones.map(u => `<option value="${u}">${u}</option>`).join('');
  sel.value = state.ubicFilter;
}
function matchesFilter(r) {
  const term = state.search.trim().toLowerCase();
  const matchesSearch = !term || r.proveedor.toLowerCase().includes(term) || r.ubicacion.toLowerCase().includes(term);
  const matchesUbic = !state.ubicFilter || r.ubicacion === state.ubicFilter;
  return matchesSearch && matchesUbic;
}

// =====================================================================
// # 08 LISTA DE PROVEEDORES (grouped list)
// =====================================================================
function renderProviderList() {
  const container = document.getElementById('providerList');
  const cat = DATA[state.category];
  const unit = cat.unit || '$';
  const rows = cat.rows.filter(matchesFilter);
  const locKind = cat.loc_kind;

  const grouped = new Map();
  rows.forEach(r => { if (!grouped.has(r.proveedor)) grouped.set(r.proveedor, []); grouped.get(r.proveedor).push(r); });
  const providers = [...grouped.keys()].sort((a, b) => {
    const sa = grouped.get(a).reduce((x,r) => x + r.presupuesto_total, 0);
    const sb = grouped.get(b).reduce((x,r) => x + r.presupuesto_total, 0);
    return sb - sa;
  });

  document.getElementById('toolbarCount').textContent = `${providers.length} proveedor(es) · ${rows.length} ubicación(es)`;

  if (!providers.length) {
    container.innerHTML = `<div class="empty-state">Ningún registro coincide con el filtro actual.<br><b>Ajusta la búsqueda o el filtro de ubicación.</b></div>`;
    return;
  }

  container.innerHTML = providers.map(name => {
    const list = grouped.get(name);
    const presupuesto_total = list.reduce((a,r) => a + r.presupuesto_total, 0);
    const presupuesto_ejecutado = list.reduce((a,r) => a + r.presupuesto_ejecutado, 0);
    const fcl_ejecutado = list.reduce((a,r) => a + r.fcl_ejecutado, 0);
    const viajes_estimados = list.reduce((a,r) => a + r.viajes_estimados, 0);
    const pct = presupuesto_total > 0 ? Math.min(100, presupuesto_ejecutado / presupuesto_total * 100) : 0;
    const isExpanded = state.expandedKeys.has(name);

    return `
    <div class="provider-group ${isExpanded ? 'expanded' : ''}" data-key="${encodeURIComponent(name)}">
      <div class="provider-head" data-action="toggle-expand">
        <svg class="chevron" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="provider-avatar">${initials(name)}</div>
        <div class="provider-name-wrap">
          <div class="provider-name">${name}</div>
          <div class="provider-meta">${list.length} ubicación(es) · ${fmtNum(fcl_ejecutado,1)} FCL ejecutados de ${fmtNum(viajes_estimados,0)} est.</div>
        </div>
        <div class="provider-stats">
          <div class="pstat"><div class="pstat-label">${unit === 'fcl' ? 'Adjudicado' : 'Presupuesto'}</div><div class="pstat-value">${fmtVal(presupuesto_total, unit)}</div></div>
          <div class="pstat"><div class="pstat-label">Ejecutado</div><div class="pstat-value">${fmtVal(presupuesto_ejecutado, unit)}</div></div>
          <div class="provider-progress-wrap">
            <div class="provider-progress-bar"><div class="provider-progress-fill" style="width:${pct}%"></div></div>
            <div class="provider-progress-pct">${pct.toFixed(0)}%</div>
          </div>
        </div>
      </div>
      <div class="route-panel">
        <div class="route-list">
          ${list.sort((a,b) => b.presupuesto_total - a.presupuesto_total).map(r => renderLocationRow(r, locKind, unit)).join('')}
        </div>
      </div>
    </div>`;
  }).join('');

  container.querySelectorAll('.provider-head').forEach(head => {
    head.addEventListener('click', () => {
      const key = decodeURIComponent(head.closest('.provider-group').dataset.key);
      if (state.expandedKeys.has(key)) state.expandedKeys.delete(key); else state.expandedKeys.add(key);
      renderProviderList();
    });
  });
}

function renderLocationRow(r, locKind, unit) {
  const pct = r.presupuesto_total > 0 ? Math.min(100, (r.presupuesto_ejecutado / r.presupuesto_total) * 100) : (r.sin_presupuesto ? 100 : 0);
  const barClass = r.sin_presupuesto ? 'striped' : 'blue';
  const tarifaPill = unit === 'fcl' ? '' : `<span class="tarifa-pill">Tarifa: ${fmtUSD(r.tarifa_inicial, {decimals: r.tarifa_inicial % 1 !== 0 ? 2 : 0})}</span>`;
  return `
    <div class="route-row ${r.sin_presupuesto ? 'sin-presupuesto' : ''}">
      <div class="route-top">
        <div>
          <span class="route-name">${locKind}: ${r.ubicacion}${unit === 'fcl' ? ' — Destino ' + r.servicio : ''}</span>
          ${r.sin_presupuesto ? '<span class="flag">Sin presupuesto</span>' : ''}
        </div>
        <div class="route-right">
          <span class="route-viajes">${fmtNum(r.fcl_ejecutado,1)} / ${fmtNum(r.viajes_estimados,1)} viajes</span>
          ${tarifaPill}
        </div>
      </div>
      <div class="bar-wrap">
        <div class="bar-fill ${barClass}" style="width:${pct}%"></div>
        <span class="bar-pct-label">${r.sin_presupuesto ? fmtUSD(r.presupuesto_ejecutado) + ' ejecutado (sin presupuesto asignado)' : fmtUSD(r.presupuesto_ejecutado) + ' / ' + fmtUSD(r.presupuesto_total)}</span>
      </div>
    </div>
  `;
}

// =====================================================================
// # 09 NOTA DE PIE
// =====================================================================
function renderFooterNote() {
  const el = document.getElementById('footerNote');
  const cat = DATA[state.category];
  const unmatched = cat.unmatched_codes;
  const unmatchedTxt = Object.keys(unmatched).length
    ? `<span class="warn-txt">${Object.entries(unmatched).map(([k,v]) => `${k} (${v} envíos)`).join(', ')}</span> tienen ejecución real en Horizon para esta categoría pero no aparecen como proveedor en la hoja de adjudicación — probablemente falte registrar su tarifa, o el código no está mapeado. Corrígeme el mapeo si conoces a qué proveedor corresponde.`
    : 'Todos los códigos de proveedor de Horizon calzaron con un proveedor de la hoja de adjudicación.';
  const zeroProvNote = state.category === 'oplog'
    ? ' <b>DP WORLD LOGISTICS S.R.L.</b> y <b>MAERSK LOGISTICS &amp; SERVICES PERU S.A.</b> ya están mapeados (códigos DPW/DPWL y Maersk), pero muestran $0 ejecutado porque hoy no tienen ningún envío con Mode=Marítimo y Status=Confirmado en Horizon — no es un problema de mapeo, es que aún no han ejecutado.'
    : '';
  const methodologyTxt = (cat.unit === 'fcl')
    ? `Ejecutado = FCL confirmados en Horizon (Mode = Marítimo, Status = Confirmado) agrupados por Naviera (campo "Line") + Puerto de Embarque (POL), y cruzados contra el Volumen adjudicado por Naviera/POL/Destino de la hoja "Línea". El Destino de cada envío se infiere desde el Puerto de Descarga (POD) de Horizon, ubicándolo dentro del bloque de destino de la hoja de tarifas (ej. Shanghai/Shenzhen → China / Hong Kong).`
    : `Ejecutado = FCL confirmados en Horizon (Mode = Marítimo, Status = Confirmado) sumados por ${cat.loc_kind === 'POL' ? 'Puerto de Embarque (POL)' : 'Packing / planta'}, identificando al proveedor vía el campo de Horizon correspondiente a esta categoría. Mapeo de códigos usado: LIP Aduanas→LIP ADUANAS S.A. · NWT→NEW TRANSPORT S.A · SRL→SPECIALIZED REEFER (LOGIST / LOGISTICS S.A.C. según hoja) · DPW/DPWL→DP WORLD LOGISTICS S.R.L. · Maersk→MAERSK LOGISTICS &amp; SERVICES PERU S.A. · Chavimochic→Despachos Aduaneros Chavimochic SAC.${zeroProvNote}`;
  el.innerHTML = `
    <b>Notas de esta categoría (${cat.label}):</b><br>
    ${methodologyTxt}<br>
    ${unmatchedTxt}
  `;
}

function renderAll() {
  renderTabs();
  populateFilters();
  renderKPIs();
  renderProviderList();
  renderFooterNote();
}

document.getElementById('searchInput').addEventListener('input', (e) => { state.search = e.target.value; renderProviderList(); document.getElementById('toolbarCount'); });
document.getElementById('ubicFilter').addEventListener('change', (e) => { state.ubicFilter = e.target.value; renderProviderList(); });

renderAll();

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href') || '';
  if (href.startsWith('presupuesto_transporte_dashboard_v2.html')) {
    e.preventDefault();
    window.parent.postMessage({ type: 'navigate', view: 'dashboard' }, '*');

    e.preventDefault();
    window.parent.postMessage({ type: 'navigate', view: 'maestro' }, '*');

<script>
(function() {
  function loadTpl(id) {
    var raw = document.getElementById(id).textContent;
    return raw.split('<%SCRIPT_END%>').join('<' + '/script>');
  }
  var views = ['dashboard', 'maestro', 'adjudicacion'];
  var frames = {};
  views.forEach(function(v) {
    frames[v] = document.getElementById('frame-' + v);
    var blob = new Blob([loadTpl('tpl-' + v)], { type: 'text/html' });
    frames[v].src = URL.createObjectURL(blob);
  });

  var sharedOverrides = {};
  var readyFrames = {};

  function broadcastOverrides(target) {
    var payload = { type: 'sync-overrides', overrides: sharedOverrides };
    if (target) { target.contentWindow.postMessage(payload, '*'); }
    else { views.forEach(function(v) { frames[v].contentWindow.postMessage(payload, '*'); }); }
  }

  window.addEventListener('message', function(e) {
    var msg = e.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'ready') {
      readyFrames[msg.view] = true;
      if (Object.keys(sharedOverrides).length) broadcastOverrides(frames[msg.view]);
    } else if (msg.type === 'tariff-updated') {
      sharedOverrides[msg.key] = msg.value;
      broadcastOverrides();
    } else if (msg.type === 'navigate') {
      setActiveView(msg.view);
      if (msg.view === 'maestro' && msg.key) {
        setTimeout(function() { frames.maestro.contentWindow.postMessage({ type: 'open-key', key: msg.key }, '*'); }, 60);
      }
    }
  });

  function setActiveView(view) {
    views.forEach(function(v) {
      frames[v].classList.toggle('active', v === view);
    });
  }
})();
</script>
</body>
</html>
