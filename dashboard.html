    <div class="kc" style="--acc:var(--amber)"><div class="kl">Senasa Attention</div><div class="kv" style="font-size:20px;">${senasaCount} / ${totalBooking}</div><div class="kf">${senasaPct}%</div></div>
    <div class="kc" style="--acc:var(--navy2)"><div class="kl">Booking confirmado</div><div class="kv">${totalBooking}</div></div>
    <div class="kc" style="--acc:var(--blue)"><div class="kl">Booking aéreo</div><div class="kv">${bookAer}</div><div class="kf">${totalBooking?pct(bookAer,totalBooking):0}%</div></div>
    <div class="kc" style="--acc:var(--navy2)"><div class="kl">Booking marítimo</div><div class="kv">${bookMar}</div><div class="kf">${totalBooking?pct(bookMar,totalBooking):0}%</div></div>
    <div class="kc" style="--acc:var(--purple)"><div class="kl">Booking terrestre</div><div class="kv">${bookTer}</div><div class="kf">${totalBooking?pct(bookTer,totalBooking):0}%</div></div>
  </div>`;

  const ex = EX || {dam_by_mode:[]};
  const mxM = Math.max(1, ...ex.dam_by_mode.map(m=>m.dam_with));
  document.getElementById('exec-dam').innerHTML = `
    <div class="card"><div class="ct">DAMs únicas por modo</div><div class="bars">${ex.dam_by_mode.length ? ex.dam_by_mode.map(m=>`<div class="br"><span class="bl">${m.mode}</span><div class="bt"><div class="bf" style="width:${calcPct(m.dam_with,mxM)}%"></div></div><span class="bv">${m.dam_with}</span></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>
    <div class="card"><div class="ct">Cobertura DAM</div><div class="tbl-wrap"><table class="std"><thead><tr><th>Modo</th><th style="text-align:right">DAMs</th><th style="text-align:right">Sin DAM</th><th style="text-align:right">% Cob.</th></tr></thead><tbody>${ex.dam_by_mode.map(m=>`<tr><td>${m.mode}</td><td class="mono" style="text-align:right">${m.dam_with}</td><td class="mono" style="text-align:right">${m.dam_without}</td><td><span class="pill ${badge(m.pct)}">${m.pct}%</span></td></tr>`).join('')}</tbody></table></div></div>`;

  const dest = DEST || [], lineas = LINEAS || [];
  const mxD = Math.max(1, ...dest.map(d=>d.fcl)), mxL = Math.max(1, ...lineas.map(l=>l.fcl));
  document.getElementById('exec-routes').innerHTML = `
    <div class="card"><div class="ct">Top destinos</div><div class="bars">${dest.length ? dest.map(d=>`<div class="br"><span class="bl">${d.port}</span><div class="bt"><div class="bf" style="width:${calcPct(d.fcl,mxD)}%;background:var(--amber);"></div></div><span class="bv">${fmt1(d.fcl)}</span></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>
    <div class="card"><div class="ct">FCL por línea naviera</div><div class="bars">${lineas.length ? lineas.map(l=>`<div class="br"><span class="bl">${l.line}</span><div class="bt"><div class="bf" style="width:${calcPct(l.fcl,mxL)}%"></div></div><span class="bv">${fmt1(l.fcl)}</span></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>`;

  // Curva: PO/booking distintos por Pack Plan, una línea por modo
  const weeks = [...new Set(ft.map(r=>r.pack_plan))].sort((a,b)=>a-b);
  document.getElementById('exec-line-stat').textContent = `${weeks.length} semana(s)`;
  const wrap = document.getElementById('exec-line-wrap');
  if (weeks.length < 2){
    wrap.innerHTML = '<div class="empty-state">Selecciona al menos 2 semanas para trazar la curva</div>';
    return;
  }
  const modeColors = {'Aéreo':'var(--blue)','Marítimo':'var(--navy2)','Terrestre':'var(--purple)'};
  const modeData = {};
  Object.keys(modeColors).forEach(m=>{ modeData[m] = weeks.map(wk=>new Set(ft.filter(r=>r.pack_plan===wk && r.mode===m && r.booking).map(r=>r.booking)).size); });

  const W=900, H=260, pL=34, pB=26, pT=12;
  const mxV = Math.max(...Object.values(modeData).flat(), 1);
  const xOf = i => pL + i*(W-pL-14)/(weeks.length-1);
  const yOf = v => H-pB-(v/mxV)*(H-pT-pB);
  const grid = [0,.25,.5,.75,1].map(f=>{ const y=pT+(1-f)*(H-pT-pB); return `<line x1="${pL}" y1="${y.toFixed(0)}" x2="${W-4}" y2="${y.toFixed(0)}" stroke="var(--line)" stroke-width="1"/><text x="${pL-6}" y="${(y+3).toFixed(0)}" text-anchor="end" font-size="9" fill="var(--ink-faint)" font-family="JetBrains Mono">${Math.round(mxV*f)}</text>`; }).join('');
  const xlbls = weeks.map((wk,i)=>`<text x="${xOf(i).toFixed(0)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-soft)" font-family="JetBrains Mono">S${wk}</text>`).join('');
  let svgLines = '';
  Object.keys(modeColors).forEach(m=>{
    const pts = weeks.map((wk,i)=>({x:xOf(i), y:yOf(modeData[m][i])}));
    const path = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    svgLines += `<path d="${path}" fill="none" stroke="${modeColors[m]}" stroke-width="2.2"/>`;
    svgLines += pts.map((p,i)=>`<circle class="exec-dot" data-mode="${m}" data-i="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.6" fill="${modeColors[m]}" stroke="var(--surface)" stroke-width="1.3" style="cursor:pointer;"/>`).join('');
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;" preserveAspectRatio="none">${grid}${svgLines}${xlbls}</svg>`;
  wrap.querySelectorAll('circle.exec-dot').forEach(dot=>{
    dot.addEventListener('mouseenter', ()=>{
      const m = dot.dataset.mode, i = +dot.dataset.i, wk = weeks[i];
      const tip = document.getElementById('execTooltip');
      tip.innerHTML = `<b>S${wk} · ${m}</b><br>Booking diferenciados: <b class="mono">${modeData[m][i]}</b>`;
      tip.style.opacity = '1';
      const rect = wrap.getBoundingClientRect();
      const scaleX = rect.width/W, scaleY = rect.height/H;
      const cx = +dot.getAttribute('cx')*scaleX, cy = +dot.getAttribute('cy')*scaleY;
      tip.style.left = (rect.left+cx+window.scrollX+12)+'px';
      tip.style.top = (rect.top+cy+window.scrollY-10)+'px';
    });
    dot.addEventListener('mouseleave', ()=>{ document.getElementById('execTooltip').style.opacity='0'; });
  });
}

/* ============================================================
   # 10 RENDER — TRANSPORTE: Pickup / Packing / Receiving
   Mantiene Chart.js (misma librería que control_tower_transporte),
   confinado a este módulo para no mezclar motores de gráficos.
   ============================================================ */
let chartRegistry = []; // {id, build(ctx)} — permite reconstruir al cambiar de tema

function chartColor(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }
function baseChartOptions(extra){
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ labels:{ color:chartColor('--ink-soft'), font:{family:'Instrument Sans', size:11} } } },
    scales:{
      x:{ ticks:{color:chartColor('--ink-faint'), font:{family:'JetBrains Mono', size:9.5}}, grid:{color:chartColor('--line')} },
      y:{ ticks:{color:chartColor('--ink-faint'), font:{family:'JetBrains Mono', size:9.5}}, grid:{color:chartColor('--line')} }
    }
  }, extra||{});
}
function stackedBarConfig(labels, series /* [{label,data,color}] */){
  return { type:'bar', data:{ labels, datasets:series.map(s=>({label:s.label, data:s.data, backgroundColor:s.color})) },
    options: baseChartOptions({ scales:{ x:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{display:false}}, y:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{color:chartColor('--line')}} } }) };
}
function lineConfig(labels, data, color){
  return { type:'line', data:{ labels, datasets:[{ data, borderColor:color, backgroundColor:color+'33', fill:true, tension:.35, pointRadius:3 }] },
    options: baseChartOptions({ plugins:{legend:{display:false}} }) };
}
function donutConfig(labels, data, colors){
  return { type:'doughnut', data:{ labels, datasets:[{data, backgroundColor:colors, borderWidth:0}] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom', labels:{color:chartColor('--ink-soft'), font:{family:'Instrument Sans', size:11}, boxWidth:10}}} } };
}
function barSimpleConfig(labels, data, colors){
  return { type:'bar', data:{ labels, datasets:[{data, backgroundColor:colors}] },
    options: baseChartOptions({ plugins:{legend:{display:false}} }) };
}

function mountChart(canvasId, config){
  const el = document.getElementById(canvasId);
  if(!el) return;
  if(el._chart) el._chart.destroy();
  el._chart = new Chart(el.getContext('2d'), config);
  chartRegistry.push(canvasId);
}
function stageBadge(v, invert){
  const good = invert ? v<=10 : v>=90;
  const mid  = invert ? v<=30 : v>=75;
  return good ? 'ok' : mid ? 'warn' : 'bad';
}

/* ============================================================
   # 10b HELPERS — portados literalmente de control_tower_transporte
   (countBy/avg/pct/groupCategorical/groupAvg/weeklyAvg), para que las
   3 vistas de Transporte calculen los KPIs exactamente igual que en
   producción, ahora sobre TRANSPORT_RAW (real, fila a fila).
   ============================================================ */
function countBy(rows, field){
  const o = {};
  rows.forEach(r => { const v = r[field]; if (v != null) o[v] = (o[v]||0)+1; });
  return o;
}
function avgField(rows, field){
  const vals = rows.map(r => r[field]).filter(v => v != null);
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function pct(n, total){ return total ? +(n/total*100).toFixed(1) : 0; }
function groupCategorical(rows, groupField, catField){
  const base = {};
  rows.forEach(r => {
    const g = r[groupField], c = r[catField];
    if (g == null || c == null) return;
    base[g] = base[g] || {}; base[g][c] = (base[g][c]||0)+1;
  });
  return base;
}
function groupOnLate(rows, groupField, catField, okValues){
  const g = groupCategorical(rows, groupField, catField);
  const out = {};
  Object.keys(g).forEach(k=>{
    const total = Object.values(g[k]).reduce((a,b)=>a+b,0);
    const on = okValues.reduce((a,ok)=>a+(g[k][ok]||0),0);
    out[k] = {on, late: total-on, total};
  });
  return out;
}
function weeklyCount(rows){
  const o = {}; rows.forEach(r => { o[r.pp] = (o[r.pp]||0)+1; });
  const weeks = Object.keys(o).map(Number).sort((a,b)=>a-b);
  return { labels: weeks.map(w=>'S'+w), data: weeks.map(w=>o[w]) };
}
function currentRows(){ return TRANSPORT_RAW || TRANSPORT_RAW_FALLBACK; }

/* ============================================================
   # 10a PICKUP — versión completa (KPIs con barra de progreso,
   detención por almacén con Chart.js, cumplimiento por puerto y
   naviera, tendencia semanal, y banner de calidad de datos que
   excluye outliers reales de los promedios), portada del Stage 01
   de control_tower_transporte__4_.html. Dataset real: TRANSPORT_RAW.
   ============================================================ */
function trGroupDetention(rows, groupField, detField){
  const g = {};
  rows.forEach(r=>{
    const key = r[groupField]; const cat = r[detField];
    if(!key || !cat) return;
    g[key] = g[key] || {STANDARD:0, HIGH:0, CRITICAL:0};
    if(g[key][cat]!==undefined) g[key][cat]++;
  });
  return g;
}
function trAvgFiltered(rows, field, maxH){
  maxH = maxH || 72;
  const valid = [], excluded = [];
  rows.forEach(r=>{
    const v = r[field];
    if(v===null || v===undefined) return;
    if(v < 0 || v > maxH) excluded.push({field, value:v, id:r.pp});
    else valid.push(v);
  });
  return { avg: valid.length ? sum(valid)/valid.length : null, validCount: valid.length, excluded };
}
function trComplianceByGroup(rows, groupField, complianceField, detHField){
  const g = {};
  rows.forEach(r=>{
    const key = r[groupField];
    if(!key) return;
    g[key] = g[key] || { on:0, late:0, detSum:0, detCount:0 };
    const c = r[complianceField];
    if(c==='ON TIME') g[key].on++; else if(c==='LATE') g[key].late++;
    if(detHField && r[detHField]!=null && r[detHField]>=0 && r[detHField]<=72){ g[key].detSum += r[detHField]; g[key].detCount++; }
  });
  return Object.entries(g).map(([name,v])=>({
    name, total: v.on+v.late, latePct: (v.on+v.late)?pct(v.late,v.on+v.late):0,
    avgDet: v.detCount ? v.detSum/v.detCount : null,
  })).sort((a,b)=>b.total-a.total);
}
function trComplianceCritByGroup(rows, groupField, complianceField, detField){
  const g = {};
  rows.forEach(r=>{
    const key = r[groupField];
    if(!key) return;
    g[key] = g[key] || { on:0, late:0, crit:0, detTotal:0 };
    const c = r[complianceField];
    if(c==='ON TIME') g[key].on++; else if(c==='LATE') g[key].late++;
    const d = r[detField];
    if(d){ g[key].detTotal++; if(d==='CRITICAL') g[key].crit++; }
  });
  return Object.entries(g).map(([name,v])=>({
    name, total: v.on+v.late, latePct: (v.on+v.late)?pct(v.late,v.on+v.late):0,
    critPct: v.detTotal ? pct(v.crit,v.detTotal) : 0,
  })).sort((a,b)=>b.total-a.total);
}
function trDataQualityBadge(excludedTotal, containerId){
  return `<div class="dq-banner" onclick="document.getElementById('${containerId}').classList.toggle('open')">
    <span>⚠ Calidad de datos: ${excludedTotal} valor(es) excluidos de los promedios automáticamente</span>
    <span>Ver detalle ▾</span>
  </div>`;
}

/* ============================================================
   # 10b PACKING — versión completa (KPIs, donut Pre-Loading, bar de
   Dispatch Delay, tendencia semanal de loading time, detención +
   delays promedio, cumplimiento por naviera apilado, card de
   Positioning), portada del Stage 02 de control_tower_transporte.
   Dataset real: TRANSPORT_RAW.
   ============================================================ */
function trAvgSigned(rows, field, capAbs){
  capAbs = capAbs || 720;
  const valid = rows.map(r=>r[field]).filter(v=>v!=null && Math.abs(v)<=capAbs);
  return valid.length ? sum(valid)/valid.length : null;
}
function trWeeklyAvg(rows, field, filterFn){
  const g = {};
  rows.forEach(r=>{
    const v = r[field];
    if (v==null || (filterFn && !filterFn(v))) return;
    g[r.pp] = g[r.pp] || [];
    g[r.pp].push(v);
  });
  const weeks = Object.keys(g).map(Number).sort((a,b)=>a-b);
  return { labels: weeks.map(w=>'PP'+w), data: weeks.map(w=>+(sum(g[w])/g[w].length).toFixed(2)) };
}
function minutesToHM(m){
  if (m==null || isNaN(m)) return '–';
  const sign = m<0 ? '-' : '';
  const abs = Math.abs(Math.round(m));
  return `${sign}${Math.floor(abs/60)}h ${abs%60}min`;
}
function trStackedCompliance3(rows, groupField, complianceField){
  const g = {};
  rows.forEach(r=>{
    const key = r[groupField]; const c = r[complianceField];
    if (!key || !c) return;
    g[key] = g[key] || {'ON TIME':0,'LATE':0,'CRITICAL LATE':0};
    if (g[key][c]!==undefined) g[key][c]++;
  });
  return g;
}

function renderPacking(){
  const rows = currentRows();
  const comp = countBy(rows, 'packingCompliance');
  const compTotal = Object.values(comp).reduce((a,b)=>a+b,0);
  const onTimePct = pct(comp['ON TIME']||0, compTotal);
  const latePct = pct(comp['LATE']||0, compTotal);
  const critLatePct = pct(comp['CRITICAL LATE']||0, compTotal);

  const det = countBy(rows, 'detentionPacking');
  const detTotal = Object.values(det).reduce((a,b)=>a+b,0);
  const noDetPct = pct(det['NO DETENTION']||0, detTotal);
  const highDetPct = pct(det['HIGH DETENTION']||0, detTotal);
  const critDetPct = pct(det['CRITICAL DETENTION']||0, detTotal);

  const avgCargaStats = trAvgFiltered(rows, 'tiempoCargaMin', 1440);
  const avgCarga = avgCargaStats.avg;
  const dispatch = countBy(rows, 'dispatchDelay');
  const dispatchTotal = Object.values(dispatch).reduce((a,b)=>a+b,0);
  const dispOnTimePct = pct(dispatch['ON TIME']||0, dispatchTotal);
  const dispHighPct = pct(dispatch['HIGH DELAY']||0, dispatchTotal);
  const dispCritPct = pct(dispatch['CRITICAL DELAY']||0, dispatchTotal);

  const preload = countBy(rows, 'preLoadingWait');
  const checkInAvg = trAvgFiltered(rows, 'checkInDelayH');
  const entryAvg = trAvgFiltered(rows, 'entryDelayH');
  const posAvg = trAvgSigned(rows, 'positioningDeltaMin');

  const detHoursByCat = ['NO DETENTION','HIGH DETENTION','CRITICAL DETENTION'].map(cat=>{
    const vals = rows.filter(r=>r.detentionPacking===cat && r.detPackingH!=null && r.detPackingH>=0 && r.detPackingH<=72).map(r=>r.detPackingH);
    return { cat, n: det[cat]||0, pct: pct(det[cat]||0, detTotal), avgH: vals.length ? sum(vals)/vals.length : null };
  });

  const navieraGroup = trStackedCompliance3(rows, 'naviera', 'packingCompliance');
  const navieraLabels = Object.keys(navieraGroup).sort((a,b)=>{
    const totA = Object.values(navieraGroup[a]).reduce((x,y)=>x+y,0);
    const totB = Object.values(navieraGroup[b]).reduce((x,y)=>x+y,0);
    return totB-totA;
  });

  const wk = trWeeklyAvg(rows, 'tiempoCargaMin', v=>v>=0 && v<=1440);

  window.build_chPackingDonut = () => mountChart('chPackingDonut', donutConfig(['On Track','Off Track'], [preload['ON TRACK']||0, preload['OFF TRACK']||0], [chartColor('--ok'), chartColor('--bad')]));
  window.build_chPackingDispatch = () => mountChart('chPackingDispatch', barSimpleConfig(['On Time','High Delay','Critical Delay'], [dispatch['ON TIME']||0, dispatch['HIGH DELAY']||0, dispatch['CRITICAL DELAY']||0], [chartColor('--ok'), chartColor('--warn'), chartColor('--bad')]));
  window.build_chPackingWeekly = () => mountChart('chPackingWeekly', lineConfig(wk.labels, wk.data.map(v=>+(v/60).toFixed(2)), chartColor('--teal')));
  window.build_chPackingNaviera = () => mountChart('chPackingNaviera', {
    type:'bar',
    data:{ labels: navieraLabels, datasets:[
      {label:'On Time', data: navieraLabels.map(l=>navieraGroup[l]['ON TIME']), backgroundColor: chartColor('--ok')},
      {label:'Late', data: navieraLabels.map(l=>navieraGroup[l]['LATE']), backgroundColor: chartColor('--warn')},
      {label:'Critical Late', data: navieraLabels.map(l=>navieraGroup[l]['CRITICAL LATE']), backgroundColor: chartColor('--bad')},
    ]},
    options: baseChartOptions({ indexAxis:'y', scales:{ x:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{color:chartColor('--line')}}, y:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{display:false}} } }),
  });

  const detPackingOutliers = rows.filter(r=>r.detPackingH!=null && (r.detPackingH<0 || r.detPackingH>72)).length;
  const excludedTotal = checkInAvg.excluded.length + entryAvg.excluded.length + detPackingOutliers;

  return `
  <span class="mock-tag">◆ ${TRANSPORT_RAW ? "Datos en vivo — sb.from('transport_data')" : 'Datos reales (fallback local)'} · ${rows.length} registros</span>
  ${trDataQualityBadge(excludedTotal, 'packing-dq-details')}
  <div class="dq-details" id="packing-dq-details">
    Se excluyeron ${detPackingOutliers} valor(es) de "Detention at Packing" (horas fuera de rango razonable) y ${checkInAvg.excluded.length + entryAvg.excluded.length} de los delays promedio (Check-In/Entry) — probablemente errores de captura en el Excel origen.
  </div>
  <div class="ph" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 style="margin:0;font-size:20px;">Packing Process</h2>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">Stage 2 · Plant — desde el posicionamiento hasta la salida con carga</div>
      </div>
      <span class="stage-badge-count">${rows.length} SHIPMENTS · ${compTotal} WITH RECORDED APPOINTMENT</span>
    </div>
  </div>
  <div class="kg">
    <div class="kc" style="--acc:var(--ok)">
      <div class="kl">Packing Appointment Compliance</div><div class="kv">${onTimePct}<span class="u">% on time</span></div>
      <div class="kf"><span class="pill warn">${latePct}% LATE</span> <span class="pill bad">${critLatePct}% CRITICAL LATE</span></div>
      <div class="kpi-progress"><div class="seg" style="width:${onTimePct}%;background:var(--ok);"></div><div class="seg" style="width:${latePct}%;background:var(--warn);"></div><div class="seg" style="width:${critLatePct}%;background:var(--bad);"></div></div>
    </div>
    <div class="kc" style="--acc:var(--ok)">
      <div class="kl">Detention at Packing</div><div class="kv">${noDetPct}<span class="u">% no detention</span></div>
      <div class="kf"><span class="pill warn">${highDetPct}% HIGH</span> <span class="pill bad">${critDetPct}% CRITICAL</span></div>
      <div class="kpi-progress"><div class="seg" style="width:${noDetPct}%;background:var(--ok);"></div><div class="seg" style="width:${highDetPct}%;background:var(--warn);"></div><div class="seg" style="width:${critDetPct}%;background:var(--bad);"></div></div>
    </div>
    <div class="kc"><div class="kl">Avg. Loading Time</div><div class="kv" style="font-size:22px;">${avgCarga!=null?minutesToHM(avgCarga):'–'}</div><div class="kf">${avgCarga!=null?avgCarga.toFixed(1):'–'} MIN AVG.</div></div>
    <div class="kc" style="--acc:var(--warn)">
      <div class="kl">Dispatch Delay</div><div class="kv">${dispOnTimePct}<span class="u">% on time</span></div>
      <div class="kf"><span class="pill warn">${dispHighPct}% HIGH</span> <span class="pill bad">${dispCritPct}% CRITICAL</span></div>
      <div class="kpi-progress"><div class="seg" style="width:${dispOnTimePct}%;background:var(--ok);"></div><div class="seg" style="width:${dispHighPct}%;background:var(--warn);"></div><div class="seg" style="width:${dispCritPct}%;background:var(--bad);"></div></div>
    </div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Pre-Loading Wait Time <span class="sub">On Track vs. Off Track</span></div><div style="height:230px;"><canvas id="chPackingDonut"></canvas></div></div>
    <div class="card"><div class="ct">Dispatch Delay <span class="sub">Shipment distribution</span></div><div style="height:230px;"><canvas id="chPackingDispatch"></canvas></div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Avg. Loading Time by Week <span class="sub">Start → end of loading, en horas</span></div><div style="height:220px;"><canvas id="chPackingWeekly"></canvas></div></div>
    <div>
      <div class="card">
        <div class="ct">Detention at Packing <span class="sub">${detTotal} records</span></div>
        <div class="tbl-wrap"><table class="std"><thead><tr><th>Status</th><th style="text-align:right">N°</th><th style="text-align:right">%</th><th style="text-align:right">Avg. Hours</th></tr></thead>
        <tbody>${detHoursByCat.map(d=>{ const c=d.cat==='NO DETENTION'?'ok':d.cat==='HIGH DETENTION'?'warn':'bad'; const label=d.cat==='NO DETENTION'?'No Detention':d.cat==='HIGH DETENTION'?'High Detention':'Critical Detention'; return `<tr><td><span class="pill ${c}" style="font-size:9px;">●</span> ${label}</td><td class="mono" style="text-align:right">${d.n}</td><td class="mono" style="text-align:right">${d.pct}%</td><td class="mono" style="text-align:right">${d.avgH!=null?d.avgH.toFixed(2)+' h':'–'}</td></tr>`; }).join('')}</tbody></table></div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">
          <div class="fc-label">Average Delays <span style="text-transform:none;float:right;">Hours</span></div>
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:8px;"><span>Check-In Delay</span><b class="mono">${checkInAvg.avg!=null?checkInAvg.avg.toFixed(2)+' h':'–'}</b></div>

    </div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Appointment Compliance by Shipping Line <span class="sub">On Time · Late · Critical Late</span></div><div style="height:${Math.max(180,navieraLabels.length*38)}px;"><canvas id="chPackingNaviera"></canvas></div></div>

/* ============================================================
   # 10c RECEIVING — versión completa (KPIs, detención por almacén,
   cumplimiento por puerto, carrier y naviera, tendencia semanal),
   portada del Stage 03 de control_tower_transporte. Dataset real:
   TRANSPORT_RAW.
   ============================================================ */
function renderIngreso(){
  const rows = currentRows();
  const gateIn = countBy(rows, 'gateInCompliance');
  const gateInTotal = (gateIn['ON TIME']||0) + (gateIn['LATE']||0);
  const onTimePct = pct(gateIn['ON TIME']||0, gateInTotal);
  const latePct = pct(gateIn['LATE']||0, gateInTotal);

  const detGI = countBy(rows, 'detentionGateIn');
  const detGITotal = (detGI['STANDARD']||0)+(detGI['HIGH']||0)+(detGI['CRITICAL']||0);
  const stdPct = pct(detGI['STANDARD']||0, detGITotal);
  const highPct = pct(detGI['HIGH']||0, detGITotal);
  const critPct = pct(detGI['CRITICAL']||0, detGITotal);

  const fullInboundStats = trAvgFiltered(rows, 'fullInboundH');
  const excludedTotal = fullInboundStats.excluded.length;

  const almGroups = trGroupDetention(rows, 'almacenIngreso', 'detentionGateIn');
  const almLabels = Object.keys(almGroups).sort((a,b)=>{
    const totA = almGroups[a].STANDARD+almGroups[a].HIGH+almGroups[a].CRITICAL;
    const totB = almGroups[b].STANDARD+almGroups[b].HIGH+almGroups[b].CRITICAL;
    return totB-totA;
  });

  const portStats = (() => {
    const g = {};
    rows.forEach(r=>{ const key=r.puertoIngreso; if(!key) return; g[key]=g[key]||{on:0,total:0}; const c=r.gateInCompliance; if(c){ g[key].total++; if(c==='ON TIME') g[key].on++; } });
    return Object.entries(g).map(([name,v])=>({name, total:v.total, onTimePct: v.total?pct(v.on,v.total):0})).sort((a,b)=>b.total-a.total);
  })();

  const carrierGroup = (() => {
    const g = {};
    rows.forEach(r=>{ const key=r.transportista; if(!key) return; g[key]=g[key]||{on:0,late:0}; const c=r.gateInCompliance; if(c==='ON TIME') g[key].on++; else if(c==='LATE') g[key].late++; });
    return g;
  })();
  const carrierLabels = Object.keys(carrierGroup).sort((a,b)=>{
    const totA = carrierGroup[a].on+carrierGroup[a].late, totB = carrierGroup[b].on+carrierGroup[b].late;
    return totB-totA;
  });

  const lineStats = (() => {
    const g = {};
    rows.forEach(r=>{ const key=r.naviera; if(!key) return; g[key]=g[key]||{on:0,total:0,crit:0,detTotal:0}; const c=r.gateInCompliance; if(c){ g[key].total++; if(c==='ON TIME') g[key].on++; } const d=r.detentionGateIn; if(d){ g[key].detTotal++; if(d==='CRITICAL') g[key].crit++; } });
    return Object.entries(g).map(([name,v])=>({name, total:v.total, onTimePct: v.total?pct(v.on,v.total):0, critPct: v.detTotal?pct(v.crit,v.detTotal):0})).sort((a,b)=>b.total-a.total);
  })();

  const wk = weeklyCount(rows);

  window.build_chIngresoAlmacen = () => mountChart('chIngresoAlmacen', {
    type:'bar',
    data:{ labels: almLabels, datasets:[
      {label:'Standard', data: almLabels.map(l=>almGroups[l].STANDARD), backgroundColor: chartColor('--ok')},
      {label:'High', data: almLabels.map(l=>almGroups[l].HIGH), backgroundColor: chartColor('--warn')},
      {label:'Critical', data: almLabels.map(l=>almGroups[l].CRITICAL), backgroundColor: chartColor('--bad')},
    ]},
    options: baseChartOptions({ indexAxis:'y', scales:{ x:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{color:chartColor('--line')}}, y:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{display:false}} } }),
  });
  window.build_chIngresoCarrier = () => mountChart('chIngresoCarrier', {
    type:'bar',
    data:{ labels: carrierLabels, datasets:[
      {label:'On Time', data: carrierLabels.map(l=>carrierGroup[l].on), backgroundColor: chartColor('--ok')},
      {label:'Late', data: carrierLabels.map(l=>carrierGroup[l].late), backgroundColor: chartColor('--bad')},
    ]},
    options: baseChartOptions({ indexAxis:'y', scales:{ x:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{color:chartColor('--line')}}, y:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{display:false}} } }),
  });
  window.build_chIngresoWeekly = () => mountChart('chIngresoWeekly', lineConfig(wk.labels, wk.data, chartColor('--teal')));

  return `
  <span class="mock-tag">◆ ${TRANSPORT_RAW ? "Datos en vivo — sb.from('transport_data')" : 'Datos reales (fallback local)'} · ${rows.length} registros</span>
  ${trDataQualityBadge(excludedTotal, 'ingreso-dq-details')}
  <div class="dq-details" id="ingreso-dq-details">
    Se excluyeron ${excludedTotal} valor(es) de "Full Inbound Time" por estar fuera de rango razonable (negativos o &gt;72h).
  </div>
  <div class="ph" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 style="margin:0;font-size:20px;">Receiving Process</h2>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">Stage 3 · Gate-In — desde la cita de ingreso hasta la salida del almacén portuario</div>
      </div>
      <span class="stage-badge-count">${rows.length} SHIPMENTS · ${gateInTotal} WITH RECORDED APPOINTMENT</span>
    </div>
  </div>
  <div class="kg">
    <div class="kc" style="--acc:${onTimePct>=50?'var(--ok)':'var(--bad)'}">
      <div class="kl">Gate-In Appointment Compliance</div><div class="kv">${onTimePct}<span class="u">% on time</span></div>
      <div class="kf"><span class="pill bad">${latePct}% LATE</span></div>
      <div class="kpi-progress"><div class="seg" style="width:${onTimePct}%;background:var(--ok);"></div><div class="seg" style="width:${latePct}%;background:var(--bad);"></div></div>
    </div>
    <div class="kc" style="--acc:var(--ok)">
      <div class="kl">Detention at Gate-In Storage</div><div class="kv">${stdPct}<span class="u">% standard</span></div>
      <div class="kf"><span class="pill warn">${highPct}% HIGH</span> <span class="pill bad">${critPct}% CRITICAL</span></div>
      <div class="kpi-progress"><div class="seg" style="width:${stdPct}%;background:var(--ok);"></div><div class="seg" style="width:${highPct}%;background:var(--warn);"></div><div class="seg" style="width:${critPct}%;background:var(--bad);"></div></div>
    </div>
    <div class="kc" style="--acc:var(--teal)"><div class="kl">Full Inbound Time</div><div class="kv">${fullInboundStats.avg!=null?fullInboundStats.avg.toFixed(2):'–'}<span class="u">h avg.</span></div><div class="kf">Total Receiving Cycle</div></div>
    <div class="kc" style="--acc:var(--blue)"><div class="kl">Containers Received</div><div class="kv">${rows.length}<span class="u">containers</span></div><div class="kf">Con filtros actuales</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Detention by Gate-In Warehouse <span class="sub">Standard · High · Critical</span></div><div style="height:280px;"><canvas id="chIngresoAlmacen"></canvas></div></div>
    <div>
      <div class="card"><div class="ct">Compliance by Port <span class="sub">Gate-In on time</span></div>
        <div class="tbl-wrap"><table class="std"><thead><tr><th>Port</th><th style="text-align:right">N°</th><th style="text-align:right">% On Time</th></tr></thead>
        <tbody>${portStats.length ? portStats.map(p=>`<tr><td>${p.name}</td><td class="mono" style="text-align:right">${p.total}</td><td class="mono" style="text-align:right;color:${p.onTimePct>=50?'var(--ok)':'var(--warn)'};">${p.onTimePct}%</td></tr>`).join('') : '<tr><td colspan="3" class="empty-state">Sin datos</td></tr>'}</tbody></table></div>
      </div>
      <div class="card" style="margin-bottom:0;"><div class="ct">By Carrier <span class="sub">On Time vs. Late</span></div><div style="height:${Math.max(140,carrierLabels.length*32)}px;"><canvas id="chIngresoCarrier"></canvas></div></div>
    </div>
  </div>
  <div class="card">
    <div class="ct">Compliance &amp; Detention by Shipping Line <span class="sub">Gate-In</span></div>
    <div class="tbl-wrap"><table class="std"><thead><tr><th>Shipping Line</th><th style="text-align:right">N°</th><th style="text-align:right">% On Time</th><th style="text-align:right">% Crit. Det.</th></tr></thead>
    <tbody>${lineStats.length ? lineStats.map(l=>`<tr><td>${l.name}</td><td class="mono" style="text-align:right">${l.total}</td><td class="mono" style="text-align:right;color:${l.onTimePct>=50?'var(--ok)':'var(--warn)'};">${l.onTimePct}%</td><td class="mono" style="text-align:right">${l.critPct}%</td></tr>`).join('') : '<tr><td colspan="4" class="empty-state">Sin datos</td></tr>'}</tbody></table></div>
  </div>
  <div class="card"><div class="ct">Containers Received by Week <span class="sub">Trend · Pack Plan</span></div><div style="height:220px;"><canvas id="chIngresoWeekly"></canvas></div></div>`;
}

const PANEL_RENDERERS = {
  forecast: renderForecast, ports: renderPorts, weekly: renderWeekly, wep: renderWEP,
  pmi: renderPMI, air: renderAir, execute: renderExecute,
  retiro: renderRetiro, packing: renderPacking, ingreso: renderIngreso,
  upload: renderUpload,
};
const CHART_VIEWS = { retiro:['chRetiroAlmacen','chRetiroWeekly'], packing:['chPackingDonut','chPackingDispatch','chPackingWeekly','chPackingNaviera'], ingreso:['chIngresoAlmacen','chIngresoCarrier','chIngresoWeekly'] };

function buildPanels(){
  const main = document.getElementById('main');
  main.innerHTML = Object.keys(PANEL_RENDERERS).map(id => `<div class="panel" id="p-${id}"></div>`).join('');
  Object.keys(PANEL_RENDERERS).forEach(id => {
    document.getElementById('p-'+id).innerHTML = PANEL_RENDERERS[id]();
    // Algunas vistas (ej. Forecast) insertan un shell con filtros y contenedores
    // vacíos, y llenan el contenido dinámico recién cuando el shell ya existe
    // en el DOM — igual patrón que usaba AXIS 1.0 (setTimeout tras insertar).
    if (window['postRender_'+id]) window['postRender_'+id]();
  });
  // instanciar Chart.js solo para las vistas de Transporte
  Object.keys(CHART_VIEWS).forEach(view => {
    CHART_VIEWS[view].forEach(chId => { const b = window['build_'+chId]; if(b) b(); });
  });
}

// Reconstruir gráficos (colores) cuando cambia el tema
function redrawChartTheme(){
  Object.keys(CHART_VIEWS).forEach(view => {
    CHART_VIEWS[view].forEach(chId => { const b = window['build_'+chId]; if(b) b(); });
  });
}

// El arranque real ocurre en loadDataAndInit(), disparado por tryLogin()
// tras autenticar contra Supabase (ver bloque #05a más arriba).
</script>
</body>
</html>
